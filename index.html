<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet XP | Laboratorio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <section id="loginView" class="login-view">
        <div class="card login-card shadow-lg border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-primary display-4"></i>
                    <h1 class="h3 mt-3 mb-1">INTRANET XP</h1>
                    <p class="text-muted mb-0">Laboratorio PostgreSQL</p>
                </div>

                <div id="loginAlert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input id="usuario" class="form-control" autocomplete="username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input id="password" type="password" class="form-control" autocomplete="current-password" required>
                    </div>

                    <button id="loginButton" type="submit" class="btn btn-primary w-100">
                        Iniciar sesión
                    </button>
                </form>
            </div>
        </div>
    </section>

    <section id="appView" class="d-none">
        <div class="app-shell">
            <aside class="sidebar">
                <div class="brand">
                    <i class="bi bi-building-fill"></i>
                    <span>XP ASESORES</span>
                </div>

                <div id="currentUser" class="current-user"></div>

                <nav class="nav flex-column gap-1">
                    <button class="nav-link active" data-module="dashboard">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </button>
                    <button class="nav-link" data-module="politicas">
                        <i class="bi bi-journal-text"></i> Políticas
                    </button>
                    <button id="usersNav" class="nav-link d-none" data-module="usuarios">
                        <i class="bi bi-people"></i> Usuarios
                    </button>
                </nav>

                <button id="logoutButton" class="btn btn-outline-light w-100 mt-auto">
                    <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                </button>
            </aside>

            <main class="main-content">
                <header class="topbar">
                    <div>
                        <strong>Laboratorio Etapa 1</strong>
                        <span class="badge text-bg-success ms-2">API conectada</span>
                    </div>
                </header>

                <div id="content" class="content-area"></div>
            </main>
        </div>
    </section>

    <script src="js/app.js?v=24"></script>
</body>
</html>
