<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet XP</title>

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- ==========================================
         VISTA 1: LOGIN
    =========================================== -->
    <section id="loginView" class="login-view">
        <div class="login-card shadow-lg">
            <div class="login-brand-panel text-center">
                <img class="login-corporate-logo" src="assets/logo-xp.png" alt="XP Asesores" onerror="this.classList.add('d-none');this.nextElementSibling.classList.remove('d-none')">
                <div class="login-logo-fallback d-none">XP</div>
                <div class="login-eyebrow">Portal corporativo</div>
                <h1 class="login-title">INTRANET XP</h1>
                <p class="login-subtitle">Información, políticas y herramientas internas</p>
            </div>

            <div id="loginAlert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="usuario" class="form-label fw-medium">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                        <input id="usuario" class="form-control" placeholder="Ej. admin" autocomplete="username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-medium">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                        <input id="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button id="loginButton" type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <small class="text-muted">XP Asesores &copy; 2026 — Sistema Interno</small>
            </div>
        </div>
    </section>

    <!-- ==========================================
         VISTA 2: APLICACIÓN (APP SHELL)
    =========================================== -->
    <section id="appView" class="d-none">
        <div class="app-shell">
            
            <!-- BARRA LATERAL (SIDEBAR) -->
            <aside class="sidebar" id="sidebar">
                <div class="brand">
                    <img class="brand-logo" src="assets/logo-xp.png" alt="XP Asesores" onerror="this.classList.add('d-none');this.nextElementSibling.classList.remove('d-none')"><span class="brand-fallback d-none">XP</span>
                    <span>XP ASESORES</span>
                </div>

                <!-- Perfil dinámico del usuario logueado -->
                <div id="currentUser" class="current-user">
                    <i class="bi bi-person-circle fs-4 text-primary"></i>
                    <div class="overflow-hidden">
                        <div class="fw-semibold text-truncate" id="userDisplayName">Cargando...</div>
                        <div class="small text-muted text-truncate" id="userRole">Usuario</div>
                    </div>
                </div>

                <!-- Menú de Navegación -->
                <nav class="nav flex-column gap-1">
                    <button class="nav-link active" data-module="dashboard">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </button>
                    <button class="nav-link" data-module="politicas">
                        <i class="bi bi-journal-text"></i> Políticas y Comunicados
                    </button>
                    <div id="supportNav" class="d-none">
                        <button class="nav-link" data-module="soporte">
                            <i class="bi bi-tools"></i>
                            <span>Soporte / Sistemas</span>
                        </button>
                    </div>
                    <div id="usersNav" class="d-none">
                        <button id="usersMenuToggle" class="nav-link" type="button" aria-expanded="false">
                            <i class="bi bi-people"></i>
                            <span>Usuarios</span>
                            <i class="bi bi-chevron-down ms-auto submenu-arrow"></i>
                        </button>
                        <div id="usersSubmenu" class="users-submenu d-none">
                            <button class="nav-link submenu-link" data-module="usuarios-registro"><i class="bi bi-file-earmark-arrow-up"></i> Registro</button>
                            <button class="nav-link submenu-link" data-module="usuarios-alta"><i class="bi bi-person-plus"></i> Alta</button>
                            <button class="nav-link submenu-link" data-module="usuarios-consulta"><i class="bi bi-search"></i> Consulta</button>
                            <button class="nav-link submenu-link" data-module="usuarios-reporte"><i class="bi bi-file-earmark-excel"></i> Reporte</button>
                            <button class="nav-link submenu-link" data-module="direcciones"><i class="bi bi-diagram-3"></i> Direcciones</button>
                        </div>
                    </div>
                </nav>

                <!-- Botón de Cierre de Sesión -->
                <button id="logoutButton" class="btn btn-outline-light w-100 mt-auto d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Cerrar sesión</span>
                </button>
            </aside>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="main-content">
                <!-- Topbar de la app -->
                <header class="topbar">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light d-md-none border" id="sidebarToggle" type="button">
                            <i class="bi bi-list fs-5"></i>
                        </button>
                        <div>
                            <span class="fw-semibold text-dark" id="currentModuleName">BIENVENIDO</span>
                        </div>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <span class="badge rounded-pill bg-success-subtle text-success border border-success-subtle px-3 py-2">
                            <i class="bi bi-circle-fill me-1 small"></i> Conectado
                        </span>
                    </div>
                </header>

                <!-- Área donde JavaScript inyecta los módulos -->
                <div id="content" class="content-area"></div>
            </main>

        </div>
    </section>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu archivo de script -->
    <script src="js/app.js?v=130"></script>
    
    <!-- Script auxiliar opcional para mostrar/ocultar contraseña -->
    <script>
        document.getElementById('togglePassword')?.addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });
    </script>
</body>
</html>
