<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet XP V3</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- LOGIN -->
    <div id="loginView" class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow p-4 login-card">
            <h2 class="text-center">INTRANET XP</h2>

            <input
                id="email"
                class="form-control my-2"
                placeholder="Correo">

            <button
                class="btn btn-primary w-100"
                onclick="login()">
                Entrar
            </button>
        </div>
    </div>

    <!-- APP -->
    <div id="appView" class="d-none">
        <div class="d-flex">

            <!-- SIDEBAR -->
            <aside class="sidebar p-3">
                <h4>XP ASESORES</h4>

                <a href="#" onclick="loadModule('dashboard')">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>

                <a href="#" onclick="loadModule('prospectos')">
                    <i class="bi bi-people"></i>
                    Prospectos
                </a>

                <a href="#" onclick="loadModule('politicas')">
                    <i class="bi bi-journal-text"></i>
                    Políticas
                </a>

                <a href="#" onclick="loadModule('usuarios')">
                    <i class="bi bi-person-gear"></i>
                    Usuarios
                </a>

                <a href="#" onclick="loadModule('herramientas')">
                    <i class="bi bi-file-earmark-excel"></i>
                    Herramientas
                </a>

                <button
                    class="btn btn-danger w-100 mt-3"
                    onclick="logout()">
                    Salir
                </button>
            </aside>

            <!-- CONTENIDO -->
            <main class="flex-grow-1 p-4">
                <div id="content"></div>
            </main>

        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
